services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      centinela-net:
        aliases:
          - api-gateway

networks:
  centinela-net:
    external: true
